# GitHub secret scanning configuration.
# Push protection blocks commits that contain secrets before they reach the
# remote. This file opts the repository into scanning for all default patterns;
# add entries to `paths-ignore` only for test fixtures that contain fake tokens.
#
# Push protection is enabled at the organisation level (regression: #1035).
# This file re-declares the intent so it is visible in code review and so
# repository-level overrides cannot silently disable it.

push_protection:
  enabled: true
